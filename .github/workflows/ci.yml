name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "micropy-system/requirements.txt"
      - name: Install build toolchain
        run: python -m pip install --requirement micropy-system/requirements.txt
      - name: Run application unit tests
        run: python -m unittest discover -s tests -q
      - name: Run control self-test
        run: PYTHONPATH=app python app/selftest.py
      - name: Run transport self-test
        run: PYTHONPATH=app python app/transport/selftest.py
      - name: Run pinned framework tests
        working-directory: micropy-system
        run: python -m unittest discover -s tests -q
      - name: Build firmware
        run: ./micropy-system/tools/build_firmware.py
